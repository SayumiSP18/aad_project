<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Courier Service</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpg" href="assets/OIP2.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <select id="langSwitcher" class="lang-switcher">
            <option value="en">English</option>
            <option value="si">සිංහල</option>
        </select>

        <div class="logo-container">
            <img src="assets/OIP2.jpg" alt="Courier Service Logo" class="auth-logo">
        </div>

        <h2 data-i18n="register.pageTitle">Register</h2>

        <div class="role-toggle">
            <button type="button" id="tabCustomer" class="active" onclick="switchTab('customer')" data-i18n="register.tabCustomer">Customer</button>
            <button type="button" id="tabDriver" onclick="switchTab('driver')" data-i18n="register.tabDriver">Driver</button>
        </div>

        <label for="username" data-i18n="login.username">Username</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" placeholder="Enter your username" data-i18n-placeholder="login.usernamePlaceholder" required>
        </div>

        <label for="password" data-i18n="login.password">Password</label>
        <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Enter your password" data-i18n-placeholder="login.passwordPlaceholder" required>
        </div>

        <div id="customerFields">
            <label for="fullName" data-i18n="register.fullName">Full Name</label>
            <input type="text" id="fullName">

            <label for="address" data-i18n="register.address">Address</label>
            <input type="text" id="address">
        </div>

        <div id="driverFields" style="display:none;">
            <label for="licenseNo" data-i18n="register.licenseNumber">License No</label>
            <input type="text" id="licenseNo">

            <label for="branchId" data-i18n="register.branch">Branch</label>
            <select id="branchId"></select>
        </div>

        <button type="button" onclick="handleRegister()" data-i18n="register.submit">Register</button>
        <div class="err-msg" id="errMsg"></div>

        <div class="auth-links">
            <span data-i18n="register.haveAccount">Already have an account?</span> <a href="login.html" data-i18n="register.loginLink">Login</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    let currentTab = "customer";

    function switchTab(tab) {
        currentTab = tab;
        $("#tabCustomer, #tabDriver").removeClass("active");
        $("#tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).addClass("active");
        $("#customerFields").toggle(tab === "customer");
        $("#driverFields").toggle(tab === "driver");

        if (tab === "driver" && $("#branchId option").length === 0) {
            apiCall("GET", "/v1/branches/all").then(function (res) {
                let html = "";
                (res.body || []).forEach(function (b) {
                    html += `<option value="${b.branchId}">${b.name}</option>`;
                });
                $("#branchId").html(html);
            });
        }
    }

    function handleRegister() {
        const username = $('#username').val().trim();
        const password = $('#password').val().trim();
        $('#errMsg').text("");

        if (!username || !password) {
            $('#errMsg').text(t('errors.credentialsRequired'));
            return;
        }

        let url, payload;
        if (currentTab === "customer") {
            const fullName = $('#fullName').val().trim();
            const address = $('#address').val().trim();
            if (!fullName || !address) {
                $('#errMsg').text(t('errors.fullNameAddressRequired'));
                return;
            }
            url = "/v1/customers/register";
            payload = { username, password, fullName, address };
        } else {
            const licenseNo = $('#licenseNo').val().trim();
            const branchId = $('#branchId').val();
            if (!licenseNo || !branchId) {
                $('#errMsg').text(t('errors.licenseBranchRequired'));
                return;
            }
            url = "/v1/drivers/register";
            payload = { username, password, licenseNo, branchId: Number(branchId) };
        }

        apiCall("POST", url, payload)
            .then(function (response) {
                alert(response.message || t('register.success'));
                location.href = "login.html";
            })
            .catch(function (err) {
                $('#errMsg').text(err.message || t('errors.generic'));
            });
    }
</script>

</body>
</html>
