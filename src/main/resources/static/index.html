<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courier Service - Admin Console</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpg" href="assets/OIP2.jpg">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/js/i18n.js"></script>
</head>
<body>

<div class="app-shell">
  <div class="sidebar">
    <h1><img src="assets/OIP2.jpg" class="sidebar-logo"> <span data-i18n="app.title">Courier Service</span></h1>
    <div id="navLinks"></div>
    <a onclick="location.href='dashboard.html'" data-i18n="nav.analytics">Analytics</a>
    <a class="logout" id="logoutBtn" data-i18n="common.logout">Logout</a>

    <select id="langSwitcher" class="lang-switcher">
      <option value="en">English</option>
      <option value="si">සිංහල</option>
    </select>
  </div>

  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="userchip">
        <span data-i18n="common.loggedInAs">Logged in as</span> <b id="topUsername"></b> (<span id="topRole"></span>)
      </div>
    </div>

    <div class="toolbar" id="toolbar"></div>

    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle" data-i18n="modal.addRecord">Add Record</h3>
    <form id="modalForm">
      <div id="modalFields"></div>
      <div class="actions">
        <button type="button" class="btn secondary" id="modalCancel" data-i18n="common.cancel">Cancel</button>
        <button type="submit" class="btn" data-i18n="common.save">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
